<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>SASS Architecture Demo</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container" style="padding: 40px 0;">
        <h1>SASS Modular Architecture Demo</h1>
        <p style="margin: 15px 0;">Dự án chuyển đổi CSS truyền thống sang cấu trúc SASS chuẩn với <code>abstracts</code>, <code>base</code>, <code>layout</code>, và <code>components</code>.</p>
        
        <div class="card" style="margin: 20px 0;">
            <h2>SASS Card Component</h2>
