<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 style="text-align: center; margin-top: 20px;">Bộ Sưu Tập Hình Ảnh Responsive</h2>
    <p style="text-align: center; color: #666; margin-bottom: 25px;">Thay đổi kích thước trình duyệt để xem hiệu ứng Responsive (4 ảnh &gt; 700px, 2 ảnh &lt; 700px, 1 ảnh &lt; 500px)</p>

    <div class="responsive">
        <div class="gallery">
            <a target="_blank" href="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&auto=format&fit=crop">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&auto=format&fit=crop" alt="Phong cảnh thiên nhiên núi rừng" width="600" height="400">
            </a>
            <div class="desc">Thiên nhiên núi non hùng vĩ</div>
        </div>
    </div>

    <div class="responsive">
        <div class="gallery">
            <a target="_blank" href="https://images.unsplash.com/photo-1511497584788-87676104235f?w=600&auto=format&fit=crop">
                <img src="https://images.unsplash.com/photo-1511497584788-87676104235f?w=600&auto=format&fit=crop" alt="Rừng cây xanh ngát" width="600" height="400">
            </a>
            <div class="desc">Rừng cây nhiệt đới trong lành</div>
        </div>
    </div>

    <div class="responsive">
        <div class="gallery">
            <a target="_blank" href="https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=600&auto=format&fit=crop">
                <img src="https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=600&auto=format&fit=crop" alt="Cực quang phương bắc lung linh" width="600" height="400">
            </a>
            <div class="desc">Cực quang phương Bắc huyền ảo</div>
        </div>
    </div>

    <div class="responsive">
        <div class="gallery">
            <a target="_blank" href="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600&auto=format&fit=crop">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600&auto=format&fit=crop" alt="Dãy núi tuyết tráng lệ" width="600" height="400">
            </a>
            <div class="desc">Đỉnh núi phủ tuyết trắng xóa</div>
        </div>
    </div>

    <div class="clearfix"></div>

</body>
</html>
