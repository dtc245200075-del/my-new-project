<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Người Dùng - Bootstrap 5 Forms</title>
    <!-- Bootstrap 5.3.0 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <!-- CARD CHỨA FORM ĐĂNG KÝ -->
                <div class="card shadow-sm border-0 rounded-4 bg-white p-4 p-md-5">
                    
                    <!-- TIÊU ĐỀ VÀ MÔ TẢ (Sử dụng Bootstrap Text: text-center, text-muted) -->
                    <div class="text-center mb-4">
                        <div class="form-icon-circle bg-primary-subtle text-primary rounded-circle mx-auto mb-3">
                            📝
                        </div>
                        <h2 class="fw-bold text-dark mb-1">Đăng Ký Tài Khoản</h2>
                        <p class="text-muted small">
                            Vui lòng điền đầy đủ các thông tin bên dưới để tạo tài khoản mới
                        </p>
                    </div>

                    <!-- FORM ĐĂNG KÝ BOOTSTRAP -->
                    <form action="#" method="POST" id="registrationForm">
                        
                        <!-- 1. Họ và tên (Input form-control) -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="fullName" placeholder="Ví dụ: Nguyễn Văn An" required>
                        </div>

                        <!-- 2. Email (Input form-control) -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Địa chỉ Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            <small class="form-text text-muted">Chúng tôi cam kết không bao giờ chia sẻ email của bạn cho bên thứ ba.</small>
                        </div>

                        <!-- 3. Mật khẩu (Input type="password" form-control) -->
                        <div class="row g-2 mb-3">
                            <div class="col-12 col-sm-6">
                                <label for="password" class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu..." required>
                            </div>

                            <!-- 4. Xác nhận mật khẩu (Input type="password" form-control) -->
                            <div class="col-12 col-sm-6">
                                <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu..." required>
                            </div>
                        </div>

                        <!-- 5. Giới tính (Radio button) -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Giới tính <span class="text-danger">*</span></label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                <label class="form-check-label" for="genderMale">Nam</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                <label class="form-check-label" for="genderFemale">Nữ</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                <label class="form-check-label" for="genderOther">Khác</label>
                            </div>
                        </div>

                        <!-- 6. Sở thích (Checkbox) -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Sở thích</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbySports" value="sports" checked>
                                <label class="form-check-label" for="hobbySports">Thể thao</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music" checked>
                                <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyTravel" value="travel">
                                <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                            </div>
                        </div>

                        <!-- 7. Quốc gia (Dropdown Select form-select) -->
                        <div class="mb-4">
                            <label for="country" class="form-label fw-semibold">Quốc gia <span class="text-danger">*</span></label>
                            <select class="form-select" id="country" required>
                                <option value="" disabled>-- Chọn quốc gia của bạn --</option>
                                <option value="vn" selected>Việt Nam</option>
                                <option value="us">Hoa Kỳ (United States)</option>
                                <option value="jp">Nhật Bản (Japan)</option>
                                <option value="kr">Hàn Quốc (South Korea)</option>
                                <option value="sg">Singapore</option>
                                <option value="other">Quốc gia khác</option>
                            </select>
                        </div>

                        <!-- Điều khoản sử dụng -->
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="termsCheck" required checked>
                            <label class="form-check-label small text-muted" for="termsCheck">
                                Tôi đồng ý với <a href="#" class="text-decoration-none">Điều khoản sử dụng</a> và <a href="#" class="text-decoration-none">Chính sách bảo mật</a>.
                            </label>
                        </div>

                        <!-- 8. Nút Submit (Bootstrap Button: btn-primary) -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm py-2">
                                Đăng Ký Tài Khoản
                            </button>
                        </div>

                        <!-- Footer text -->
                        <p class="text-center text-muted small mt-3 mb-0">
                            Đã có tài khoản? <a href="#" class="text-decoration-none fw-semibold">Đăng nhập tại đây</a>
                        </p>
                    </form>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3.0 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
