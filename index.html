<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Menu Dropdown Ngang - Horizontal Dropdown Menu</title>
    <style>
        /* 1. Bộ chọn cố định phông chữ cho trang HTML */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f9f9f9;
        }

        /* 2. Đặt phân vùng cho trình đơn: chiều cao, đường viền, khoảng cách và màu nền */
        #menu {
            height: 40px;
            border: 1px solid #ccc;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        #menu ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        /* 3. Bộ chọn riêng cho các phần tử trong danh sách */
        #menu li {
            float: left;
            position: relative;
        }

        /* 4. Bộ chọn cố định độ rộng, chiều cao, cách hiển thị và định dạng văn bản thẻ a */
        #menu a {
            display: block;
            width: 150px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        /* 5. Bộ chọn chuyển màu nền sang màu đỏ khi con trỏ đưa qua (:hover) */
        #menu a:hover {
            background-color: red;
            color: white;
        }

        /* 6 & 7. Bộ chọn danh sách con với vị trí hiển thị và ẩn mặc định (visibility: hidden) */
        #menu ul ul {
            position: absolute;
            top: 40px;
            left: 0;
            visibility: hidden;
        }

        #menu ul ul li {
            float: none;
            background-color: #f2f2f2;
            border-top: 1px solid #ddd;
        }

        /* 8. Bộ chọn hiển thị menu con khi đưa con trỏ qua mục chọn cha */
        #menu li:hover ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <!-- Trình đơn lồng nhau hai cấp theo đúng chuẩn #menu -->
    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Máy tính bảng</a></li>
                    <li><a href="#">Laptop</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Bảo hành</a></li>
                    <li><a href="#">Sửa chữa</a></li>
                    <li><a href="#">Tư vấn</a></li>
                </ul>
            </li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
