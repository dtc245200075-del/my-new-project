<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Thực hành Box Shadow và Border Radius</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            margin: 0;
            background-color: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        /* Thẻ div ngoài bo tròn 50% */
        .box-outer {
            width: 240px;
            height: 240px;
            background-color: #3498db;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        /* Thẻ div trong bo tròn 50% và có hiệu ứng box-shadow: inset */
        .box-inner {
            width: 150px;
            height: 150px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>

<body>
    <!-- Hai thẻ div lồng nhau -->
    <div class="box-outer">
        <div class="box-inner">
            Box Shadow
        </div>
    </div>
</body>

</html>
