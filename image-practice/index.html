<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Thực hành thẻ hình ảnh trong HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            background-color: #f4f6f8;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        .image-container {
            margin: 25px auto;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        p {
            margin-top: 15px;
            font-size: 16px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <h1>Khám Phá Thiên Nhiên Tươi Đẹp</h1>
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80" 
             alt="Cảnh quan thiên nhiên tuyệt đẹp với núi rừng hùng vĩ phản chiếu trên mặt hồ nước trong xanh" 
             width="800">
        <p>Bức ảnh thiên nhiên thơ mộng với khung cảnh hồ nước và rặng núi phản chiếu ánh hoàng hôn rực rỡ.</p>
    </div>
</body>
</html>
