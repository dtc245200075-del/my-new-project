<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Người Dùng</title>
    <!-- Bootstrap 5 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-12">
                <div class="card p-4 shadow-sm bg-white">
                    <h2 class="text-center mb-3">Đăng Ký Tài Khoản</h2>
                    <p class="text-center text-muted mb-4">Điền đầy đủ thông tin để hoàn tất đăng ký</p>

                    <form>
                        <!-- Họ và tên -->
                        <div class="mb-3">
                            <label for="nameInput" class="form-label">Họ và tên</label>
                            <input type="text" class="form-control" id="nameInput" placeholder="Nhập họ và tên">
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="emailInput" class="form-label">Email</label>
                            <input type="email" class="form-control" id="emailInput" placeholder="Nhập email">
                            <small class="form-text text-muted">Chúng tôi cam kết bảo mật email của bạn.</small>
                        </div>

                        <!-- Mật khẩu -->
                        <div class="mb-3">
                            <label for="passwordInput" class="form-label">Mật khẩu</label>
                            <input type="password" class="form-control" id="passwordInput" placeholder="Nhập mật khẩu">
                        </div>

                        <!-- Xác nhận mật khẩu -->
                        <div class="mb-3">
                            <label for="confirmPasswordInput" class="form-label">Xác nhận mật khẩu</label>
                            <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Nhập lại mật khẩu">
                        </div>

                        <!-- Giới tính (Radio button) -->
                        <div class="mb-3">
                            <label class="form-label d-block">Giới tính</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="genderRadio" id="radioMale" value="Nam" checked>
                                <label class="form-check-label" for="radioMale">Nam</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="genderRadio" id="radioFemale" value="Nữ">
                                <label class="form-check-label" for="radioFemale">Nữ</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="genderRadio" id="radioOther" value="Khác">
                                <label class="form-check-label" for="radioOther">Khác</label>
                            </div>
                        </div>

                        <!-- Sở thích (Checkbox) -->
                        <div class="mb-3">
                            <label class="form-label d-block">Sở thích</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="checkSports" value="Thể thao" checked>
                                <label class="form-check-label" for="checkSports">Thể thao</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="checkReading" value="Đọc sách">
                                <label class="form-check-label" for="checkReading">Đọc sách</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="checkTravel" value="Du lịch">
                                <label class="form-check-label" for="checkTravel">Du lịch</label>
                            </div>
                        </div>

                        <!-- Quốc gia (Dropdown Select) -->
                        <div class="mb-4">
                            <label for="countrySelect" class="form-label">Quốc gia</label>
                            <select class="form-select" id="countrySelect">
                                <option value="vn" selected>Việt Nam</option>
                                <option value="us">Hoa Kỳ</option>
                                <option value="jp">Nhật Bản</option>
                                <option value="other">Khác</option>
                            </select>
                        </div>

                        <!-- Nút Submit -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
