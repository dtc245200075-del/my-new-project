<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký và Carousel Lợi Ích Dịch Vụ</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .carousel-item img {
            height: 480px;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-light py-4">

    <div class="container">
        <div class="row align-items-center bg-white shadow rounded p-4">
            
            <!-- 1. Carousel hiển thị các lợi ích của dịch vụ -->
            <div class="col-md-6 mb-4 mb-md-0">
                <div id="benefitCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner rounded">
                        <div class="carousel-item active">
                            <img src="image1.jpg" class="d-block w-100" alt="Lợi ích 1">
                            <div class="carousel-caption bg-dark bg-opacity-50 rounded p-2">
                                <h5>Học tập linh hoạt</h5>
                                <p>Học mọi lúc mọi nơi trên nhiều thiết bị.</p>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="image2.jpg" class="d-block w-100" alt="Lợi ích 2">
                            <div class="carousel-caption bg-dark bg-opacity-50 rounded p-2">
                                <h5>Chuyên gia đồng hành</h5>
                                <p>Đội ngũ giảng viên giàu kinh nghiệm thực tế.</p>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="image3.jpg" class="d-block w-100" alt="Lợi ích 3">
                            <div class="carousel-caption bg-dark bg-opacity-50 rounded p-2">
                                <h5>Cơ hội việc làm</h5>
                                <p>Kết nối doanh nghiệp và hỗ trợ việc làm.</p>
                            </div>
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#benefitCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#benefitCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>
            </div>

            <!-- 2. Form đăng ký tài khoản (họ tên, email, mật khẩu, xác nhận mật khẩu) -->
            <div class="col-md-6">
                <h3 class="text-center mb-3">Đăng Ký Tài Khoản</h3>
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Họ và tên</label>
                        <input type="text" class="form-control" id="name" placeholder="Nhập họ và tên">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Nhập email">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu">
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu">
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Đăng Ký</button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
